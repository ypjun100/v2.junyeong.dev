---
layout: default
---

<article class="post">
  {%- if page.kind == 'blog' %}
  <a class="post__back" href="{{ '/posts/' | relative_url }}">← Posts</a>
  {%- else %}
  <a class="post__back" href="{{ '/about/' | relative_url }}">← About</a>
  {%- endif %}

  <header class="post__header">
    <h1 class="post__title">{{ page.title }}</h1>
    {%- include post-meta.html -%}
  </header>

  {%- include post-summary.html -%}
  {%- include post-extras.html -%}
  {%- include gallery.html -%}

  <div class="post__body">
    {{ content }}
  </div>

  {%- include post-tags.html -%}
</article>
