name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Years of experience on the home page is derived from site.time, which is
  # frozen at build time. Rebuilding monthly keeps it from going stale between
  # pushes. GitHub suspends cron on repositories with no activity for 60 days.
  schedule:
    - cron: "0 18 1 * *"  # 1st of each month, 03:00 KST

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - uses: actions/configure-pages@v5

      - name: Build
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check links and images
        run: bundle exec htmlproofer _site --disable-external --allow-hash-href --ignore-missing-alt

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
